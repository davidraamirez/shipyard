packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  bcrypt: false
  esbuild: false
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: false
# Una sola versión de los tipos de Node, la del runtime de las imágenes (node:22).
overrides:
  '@types/node': ^22.0.0
