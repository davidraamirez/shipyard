packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  bcrypt: false
  esbuild: false
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: false
# A single version of the Node types, matching the image runtime (node:22).
overrides:
  '@types/node': ^22.0.0
